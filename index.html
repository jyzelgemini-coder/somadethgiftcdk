    <script>
      // Safeguard window.fetch to allow property assignment across iframe contexts and prevent getter-only TypeError
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(val) {
              activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment forbids descriptor alteration
        }
      })();
    </script>
